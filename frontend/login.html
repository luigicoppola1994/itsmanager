<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS Manager - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS Dedicato al Login -->
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

    <div class="container-fluid p-0">
        <div class="row g-0 vh-100">
            <!-- LEFT SIDE -->
            <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center login-left">
                <div class="logo-container bg-white rounded-4 shadow-lg p-4 d-flex justify-content-center align-items-center position-relative mb-5" style="width: 250px; height: 250px; z-index: 10;">
                    <img src="assets/img/itssmartlogo.png" alt="ITS Smart Logo" class="img-fluid" style="max-height: 100%; max-width: 100%;">
                </div>

                <div class="info-card text-center p-4 rounded-4 border z-10">
                    <h4 class="fw-bold mb-2 text-uppercase text-white-50" style="font-size:0.8rem; letter-spacing:2px;">PIATTAFORMA DI GESTIONE</h4>
                    <h2 class="fw-bold mb-1 fs-4 text-white">Istituto Tecnico Industriale</h2>
                    <h3 class="fw-semibold mb-4 text-info fs-5">A. Righi</h3>
                    <div class="info-stats d-flex justify-content-between pt-4 border-top border-light border-opacity-25 text-white">
                        <div class="stat flex-fill">
                            <div class="fw-bold fs-5">AI</div>
                            <div class="text-white-50" style="font-size:0.75rem;">Specialist</div>
                        </div>
                        <div class="stat flex-fill">
                            <div class="fw-bold fs-5">ITS</div>
                            <div class="text-white-50" style="font-size:0.75rem;">Academy</div>
                        </div>
                        <div class="stat flex-fill">
                            <div class="fw-bold fs-5">4.0</div>
                            <div class="text-white-50" style="font-size:0.75rem;">Industria</div>
                        </div>
                    </div>
                </div>

                <div class="info-footer mt-5 text-white-50 z-10" style="font-size:0.85rem;">
                    il gestionale IT intelligente, semplice, completo.
                </div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="col-12 col-md-6 d-flex flex-column justify-content-center align-items-center bg-white position-relative">
                <div class="w-100 px-4 px-md-5" style="max-width: 450px;">
                    <div class="text-info fw-bold text-center text-uppercase mb-2" style="font-size:0.8rem; letter-spacing:2px;">BENTORNATO</div>
                    <h1 class="text-primary-dark fw-bold text-center mb-2 fs-1">Accedi al pannello</h1>
                    <p class="text-secondary text-center mb-5" style="font-size:0.9rem;">Inserisci le tue credenziali per continuare</p>

                    <form id="loginForm">
                        <div class="mb-4">
                            <label for="loginEmail" class="form-label fw-bold text-primary-dark text-uppercase" style="font-size:0.75rem;">Email istituzionale</label>
                            <input type="email" class="form-control py-3 rounded-3 custom-input" id="loginEmail" placeholder="nome.cognome@its.it" required>
                        </div>
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label fw-bold text-primary-dark text-uppercase" style="font-size:0.75rem;">Password</label>
                            <input type="password" class="form-control py-3 rounded-3 custom-input" id="loginPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-3 mt-2 rounded-3 fw-semibold shadow custom-btn">Accedi al sistema</button>
                    </form>
                </div>

                <div class="right-footer position-absolute bottom-0 w-100 d-flex justify-content-between align-items-center py-3 px-4 px-md-5 border-top" style="max-width: 450px;">
                    <div class="text-secondary" style="font-size:0.75rem;">© 2026 ITS Smart Management</div>
                    <div class="d-flex align-items-center text-secondary" style="font-size:0.75rem;">
                        <span class="bg-success rounded-circle me-2" style="width:8px; height:8px;"></span> Sistema attivo
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Div per il Toast -->
    <style>
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #22c55e; color: white;
            padding: 12px 24px; border-radius: 8px; font-weight: 600;
            transform: translateX(150%); transition: transform 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 1000;
        }
        .toast.error { background: #ef4444; }
        .toast.show { transform: translateX(0); }
    </style>

    <!-- JS Separato -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="shared/auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
