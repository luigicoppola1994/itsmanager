<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS Manager - Segreteria | Gestione Corsi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="../assets/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom Segreteria CSS -->
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="segreteria.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- SIDEBAR A SINISTRA -->
        <aside class="sidebar">
            <!-- LOGO IN ALTO -->
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="../assets/img/itssmartlogo.png" alt="ITS Smart Logo">
                </div>
                <h2 class="sidebar-brand-title">ITS Manager</h2>
                <span class="sidebar-brand-subtitle">Gestionale IT</span>
            </div>

            <!-- PROFILO UTENTE -->
            <div class="sidebar-user">
                <div class="user-avatar-small">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
                <div class="user-details">
                    <div class="user-name">Segreteria Didattica</div>
                    <span class="user-role-badge">SEGRETERIA</span>
                </div>
            </div>

            <!-- MENU DI NAVIGAZIONE -->
            <ul class="sidebar-nav">
                <li>
                    <a href="dashboard.html" class="nav-item-link active" id="navCorsi">
                        <i class="bi bi-journal-bookmark-fill"></i>
                        <span>Corsi</span>
                    </a>
                </li>
                <li>
                    <a href="piano-didattico.html" class="nav-item-link" id="navPianoDidattico">
                        <i class="bi bi-book-half"></i>
                        <span>Piano Didattico</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item-link" id="navStudenti">
                        <i class="bi bi-people-fill"></i>
                        <span>Studenti</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item-link" id="navDocenti">
                        <i class="bi bi-person-video3"></i>
                        <span>Docenti</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item-link" id="navCalendario">
                        <i class="bi bi-calendar3"></i>
                        <span>Calendario</span>
                    </a>
                </li>
            </ul>

            <!-- PULSANTE LOGOUT IN BASSO -->
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Disconnetti</span>
                </button>
            </div>
        </aside>

        <!-- AREA CONTENUTO PRINCIPALE (A DESTRA) -->
        <main class="main-content">
            <!-- BARRA SUPERIORE CON TITOLO, SEARCHBAR E BOTTONE AGGIUNGI CORSO -->
            <div class="top-action-bar">
                <div class="page-header-info">
                    <h1>
                        <i class="bi bi-journal-check text-primary"></i>
                        Gestione Corsi
                    </h1>
                    <p>Panoramica completa dei corsi e delle edizioni attive dell'Istituto</p>
                </div>

                <div class="header-controls">
                    <!-- SEARCHBAR -->
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Cerca corso per nome o codice...">
                        <i class="bi bi-search"></i>
                    </div>

                    <!-- PULSANTE AGGIUNGI CORSO IN ALTO A DESTRA -->
                    <a href="nuovo-corso.html" class="btn-add-course" style="text-decoration: none;">
                        <i class="bi bi-plus-circle-fill fs-5"></i>
                        <span>Aggiungi corso</span>
                    </a>
                </div>
            </div>

            <!-- GRID DELLE CARDS DEI CORSI -->
            <div class="courses-grid" id="coursesGrid">
                <!-- LE CARDS VENGONO GENERATE DINAMICAMENTE DA JS O MOSTRATE GRAFICAMENTE -->
            </div>
        </main>
    </div>



    <!-- MODAL: MODIFICA CORSO (ANAGRAFICA) -->
    <div class="modal fade" id="editCorsoModal" tabindex="-1" aria-labelledby="editCorsoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editCorsoModalLabel"><i class="bi bi-pencil-square text-primary me-2"></i>Modifica Corso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editCorsoForm">
                    <div class="modal-body">
                        <input type="hidden" id="editCorsoId">
                        <div class="mb-3">
                            <label for="editCorsoNome" class="form-label fw-bold">Nome del Corso <span class="text-danger">*</span></label>
                            <input type="text" id="editCorsoNome" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editCorsoDescrizione" class="form-label fw-bold">Descrizione</label>
                            <textarea id="editCorsoDescrizione" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Annulla</button>
                        <button type="submit" class="btn btn-primary fw-bold px-4" id="btnSaveCorso">Salva Modifiche</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICHE -->
    <div class="toast" id="toast">Operazione completata!</div>

    <!-- Bootstrap JS Bundle (deve essere caricato PRIMA di auth.js e app.js) -->
    <script src="../assets/bootstrap.bundle.min.js"></script>

    <!-- Scripts Autenticazione e Logica Segreteria -->
    <script src="../shared/auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
