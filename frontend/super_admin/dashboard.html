<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS Manager - Super Admin</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Separato -->
    <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>

    <!-- App Container -->
    <div id="appContainer" class="container">
        <button id="logoutBtn" style="width: auto; padding: 8px 16px; margin-bottom: 20px; background: var(--danger); float: right;">Logout</button>
        <header style="clear: both;">
            <h1>Gestione Utenti</h1>
            <p class="subtitle">ITS Smart Management System | Ruolo: SUPER ADMIN</p>
        </header>

        <!-- Form per aggiungere utenti (es: super_admin e segreteria) -->
        <div class="add-user-card" id="addUserCard">
            <h2 style="margin-bottom: 20px; text-align: center;">Aggiungi Utente</h2>
            <form id="addUserForm">
                <!-- campi form per aggiungere utenti (da implementare) -->
                <p>Form da implementare</p>
            </form>
        </div>

        <!-- Griglia Utenti -->
        <div class="users-grid" id="usersGrid">
            <!-- Le card verranno inserite qui -->
        </div>
    </div>

    <div class="toast" id="toast">Operazione completata!</div>

    <!-- JS Separato -->
    <script src="../shared/auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
