<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS Manager - Studente | Timbrature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link href="../assets/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles.css?v=2.1">
    <link rel="stylesheet" href="../segreteria/segreteria.css?v=4.0">
    <link rel="stylesheet" href="studente.css?v=1.1">
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand-block">
                    <div class="sidebar-logo-container">
                        <img src="../assets/img/itssmartlogo.png" alt="ITS Smart Logo" class="sidebar-logo-img">
                    </div>
                    <div class="sidebar-brand-text">
                        <h2 class="sidebar-brand-title">ITS MANAGER</h2>
                        <span class="sidebar-brand-subtitle">Gestionale Didattico</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-user">
                <div class="user-avatar-small">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="user-details">
                    <div class="user-name">Studente</div>
                    <span class="user-role-badge">STUDENTE</span>
                </div>
            </div>

            <ul class="sidebar-nav">
                <li>
                    <a href="dashboard.html" class="nav-item-link" id="navDashboard" data-label="Dashboard">
                        <i class="bi bi-speedometer2"></i><span class="nav-label">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="lezioni.html" class="nav-item-link" id="navLezioni" data-label="Lezioni">
                        <i class="bi bi-calendar3"></i><span class="nav-label">Lezioni</span>
                    </a>
                </li>
                <li>
                    <a href="timbrature.html" class="nav-item-link active" id="navTimbrature" data-label="Timbrature">
                        <i class="bi bi-clock-history"></i><span class="nav-label">Timbrature</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Disconnetti</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP BAR -->
            <div class="rubick-top-bar">
                <nav class="rubick-breadcrumb" aria-label="breadcrumb">
                    <span class="breadcrumb-root"><i class="bi bi-mortarboard-fill me-1 text-primary"></i>ITS Manager</span>
                    <i class="bi bi-chevron-right breadcrumb-separator"></i>
                    <span class="breadcrumb-section">Studente</span>
                    <i class="bi bi-chevron-right breadcrumb-separator"></i>
                    <span class="breadcrumb-current">Timbrature</span>
                </nav>
                <div class="rubick-top-bar-actions">
                    <div class="rubick-icon-badge" title="Notifiche">
                        <i class="bi bi-bell"></i>
                        <span class="rubick-badge-dot"></span>
                    </div>
                    <div class="rubick-user-avatar" title="Studente">ST</div>
                </div>
            </div>

            <!-- PAGE HEADER -->
            <div class="nc-page-header">
                <div class="nc-breadcrumb">
                    <a href="dashboard.html" class="nc-breadcrumb-link">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                    <i class="bi bi-chevron-right nc-breadcrumb-sep"></i>
                    <span class="nc-breadcrumb-current">Timbrature</span>
                </div>
                <div class="nc-header-row">
                    <div>
                        <h1 class="nc-title">
                            <span class="nc-title-icon"><i class="bi bi-clock-history"></i></span>
                            <span>Timbrature</span>
                        </h1>
                        <p class="nc-subtitle">Visualizza le tue timbrature e presenze</p>
                    </div>
                </div>
            </div>

            <!-- CONTENT -->
            <div id="timbratureContent">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <p class="text-muted fw-semibold">Caricamento timbrature in corso...</p>
                </div>
            </div>
        </main>

        <!-- MOBILE BOTTOM BAR -->
        <div class="mobile-bottom-bar">
            <a href="dashboard.html" class="mobile-nav-item">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="lezioni.html" class="mobile-nav-item">
                <i class="bi bi-calendar3"></i>
                <span>Lezioni</span>
            </a>
            <a href="timbrature.html" class="mobile-nav-item active">
                <i class="bi bi-clock-history"></i>
                <span>Timbrature</span>
            </a>
            <button class="mobile-nav-item" id="mobileLogoutBtn">
                <i class="bi bi-box-arrow-right"></i>
                <span>Esci</span>
            </button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="../assets/bootstrap.bundle.min.js"></script>
    <script src="../shared/auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
